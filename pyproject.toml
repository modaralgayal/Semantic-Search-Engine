[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sse"
version = "0.1.0"
description = "Semantic Search Engine Benchmark"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
    "pydantic",
    "sentence-transformers",
    "faiss-cpu",
    "numpy",
]